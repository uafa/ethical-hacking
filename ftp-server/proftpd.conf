# ProFTPD 1.3.5 - hospital file server
# NOTE: deliberately insecure for the lab (anonymous login + vulnerable mod_copy).

ServerName                      "Regionshospital - File Server"
ServerType                      standalone
DefaultServer                   on
Port                            21
UseIPv6                         off
Umask                           022
MaxInstances                    30
User                            proftpd
Group                           nogroup

# The version IS shown in the banner on purpose - this is a "forgotten",
# unpatched box, so fingerprinting should reveal 1.3.5.
# ServerIdent is left at its default (on).

# Passive data connections (must match the published ports in docker-compose).
# For attackers on another host, set MasqueradeAddress to the Docker host's IP
# so passive-mode file transfers (e.g. downloading a copied file) work.
PassivePorts                    30000 30009
# MasqueradeAddress             <DOCKER_HOST_IP>

# Root directory defaults.
<Directory />
  AllowOverwrite                on
</Directory>

# --- WEAKNESS 1: anonymous access, no authentication required ----------------
# On top of that, anonymous WRITE is allowed - a classic "temporary" upload
# misconfiguration that was never removed. This also makes the mod_copy
# arbitrary-write primitive below retrievable (SITE CPTO into the share).
<Anonymous /srv/ftp>
  User                          ftp
  Group                         ftp
  UserAlias                     anonymous ftp
  RequireValidShell             off
  MaxClients                    10

  <Directory *>
    <Limit READ DIRS WRITE>
      AllowAll
    </Limit>
  </Directory>
</Anonymous>

# --- WEAKNESS 2: mod_copy / CVE-2015-3306 ------------------------------------
# With the copy engine enabled, SITE CPFR + SITE CPTO allow copying files
# anywhere the server process can reach - i.e. arbitrary file read/write by a
# remote attacker, with no additional authentication.
<IfModule mod_copy.c>
  CopyEngine                    on
</IfModule>
