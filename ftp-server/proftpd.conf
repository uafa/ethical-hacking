# ProFTPD 1.3.5 - hospital file server
# NOTE: deliberately insecure for the lab (vulnerable mod_copy / CVE-2015-3306).

ServerName                      "Regionshospital - File Server"
ServerType                      standalone
DefaultServer                   on
Port                            21
UseIPv6                         off
Umask                           022
MaxInstances                    30
User                            proftpd
Group                           nogroup

# The version IS shown in the banner on purpose - this is a "forgotten",
# unpatched box, so fingerprinting should reveal 1.3.5.
# ServerIdent is left at its default (on).

# Passive data connections (must match the published ports in docker-compose).
PassivePorts                    30000 30009
# MasqueradeAddress             <DOCKER_HOST_IP>

# Root directory defaults. AllowOverwrite lets SITE CPTO replace files.
<Directory />
  AllowOverwrite                on
  <Limit WRITE>
    AllowAll
  </Limit>
</Directory>

# --- Authentication: NO anonymous login, and no usable accounts --------------
# There is deliberately no <Anonymous> block and no valid FTP user. Normal
# logins fail. The server looks locked down... but see below.

# --- THE WEAKNESS: mod_copy / CVE-2015-3306 ----------------------------------
# mod_copy is compiled into this 1.3.5 build (confirm with `proftpd -l`). In
# 1.3.5 the SITE CPFR / SITE CPTO commands it adds are reachable *before
# authentication* - that is the vulnerability. An unauthenticated attacker can
# copy (read/write) files anywhere the server process can reach.
#
# Because the web server's document root (/var/www/html) is writable by this
# ProFTPD process, an attacker can copy a PHP payload into it and then execute
# it over HTTP -> remote code execution. This is exactly what Metasploit's
# exploit/unix/ftp/proftpd_modcopy_exec automates.
