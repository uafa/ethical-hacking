# Program definitions for the all-in-one image.
# Included by the distro's /etc/supervisor/supervisord.conf (conf.d/*.conf).

[program:postgresql]
command=/usr/lib/postgresql/13/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:proftpd]
; starts as root (to bind port 21), then drops privileges per proftpd.conf
command=/usr/local/sbin/proftpd --nodaemon --config /etc/proftpd/proftpd.conf
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
; generate host keys on first boot, then run sshd in the foreground
command=/bin/sh -c "ssh-keygen -A && exec /usr/sbin/sshd -D -e"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
